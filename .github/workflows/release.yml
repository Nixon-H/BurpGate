name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Read and bump version
        id: version
        run: |
          VER=$(grep "^version=" gradle.properties | cut -d= -f2 | tr -d ' ')
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          if [ -z "$PATCH" ]; then PATCH=0; fi
          NEW_PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "current=$VER" >> $GITHUB_OUTPUT
          echo "next=$NEW_VER" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VER" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.tag }} already exists — skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build JAR
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew embedProxyJar

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target main \
            --generate-notes \
            --title "v${{ steps.version.outputs.next }}" \
            build/libs/burp-mcp-all.jar#BurpGate-Extension-JAR \
            libs/mcp-proxy-all.jar#MCP-Proxy-JAR

      - name: Bump version in gradle.properties
        if: steps.check.outputs.exists == 'false'
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.next }}/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git push
