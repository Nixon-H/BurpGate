name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1 || echo "v0.0.0")
          MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)

          # Changelog: all commits since last tag
          git log "$LATEST..HEAD" --oneline --no-merges --format="- %s" > /tmp/release-notes.md

          # Version: only count OUR commits (skip upstream PortSwigger authors)
          OUR_LOG=$(git log "$LATEST..HEAD" --oneline --no-merges \
            --author="Nixon-H\|dependabot\[bot\]\|github-actions\[bot\]" 2>/dev/null || true)

          BUMP="skip"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *"major:"*|*"breaking:"*) BUMP="major" ;;
              *"feat:"*) [ "$BUMP" != "major" ] && BUMP="minor" ;;
              *"fix:"*) [ "$BUMP" = "skip" ] && BUMP="patch" ;;
              *"chore:"*) [ "$BUMP" = "skip" ] && BUMP="patch" ;;
            esac
          done <<< "$OUR_LOG"

          echo "bump=$BUMP" >> $GITHUB_OUTPUT

          if [ "$BUMP" = "skip" ]; then
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
            echo "version=$(echo "$LATEST" | sed 's/v//')" >> $GITHUB_OUTPUT
          else
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
            echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          fi

      - name: Skip release — no new commits from us
        if: steps.version.outputs.bump == 'skip'
        run: echo "No new non-upstream commits since ${{ steps.version.outputs.tag }}. Skipping."

      - name: Check if tag already exists
        if: steps.version.outputs.bump != 'skip'
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update gradle.properties and build JAR
        if: steps.check.outputs.exists == 'false'
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.version }}/" gradle.properties
          cat gradle.properties | grep ^version
          ./gradlew embedProxyJar

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target main \
            --notes-file /tmp/release-notes.md \
            --title "v${{ steps.version.outputs.version }}" \
            build/libs/burp-mcp-all.jar#BurpGate-Extension-JAR \
            libs/mcp-proxy-all.jar#MCP-Proxy-JAR
