name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Read version from gradle.properties
        id: version
        run: |
          VER=$(grep "^version=" gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.tag }} already exists — skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build JAR
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew embedProxyJar

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target main \
            --generate-notes \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Version ${{ steps.version.outputs.version }}" \
            build/libs/burp-mcp-all.jar#BurpGate-Extension-JAR \
            libs/mcp-proxy-all.jar#MCP-Proxy-JAR
