name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PortSwigger/mcp-server.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Nothing to sync
        if: steps.check.outputs.commits_behind == '0'
        run: echo "Upstream is up-to-date"

      - name: Merge upstream into main
        if: steps.check.outputs.commits_behind != '0'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PRE_MERGE=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base upstream/main "$PRE_MERGE" || true)

          # Merge but don't commit — we need to restore our workflows first
          git merge -X theirs upstream/main --no-commit --allow-unrelated-histories 2>&1 || true

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Tree-level conflicts in:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # Line-level 3-way merge for files we modified
          # Accepts upstream changes to lines only they changed,
          # keeps our version for lines we (or both) changed.
          # Files in KEEP_OURS are restored entirely (structural conflicts).
          KEEP_OURS="src/main/kotlin/net/portswigger/mcp/tools/Tools.kt"
          if [ -n "$MERGE_BASE" ]; then
            for f in $(git diff --name-only "$MERGE_BASE" HEAD 2>/dev/null || true); do
              skip=false
              for keep in $KEEP_OURS; do [ "$f" = "$keep" ] && skip=true && break; done
              if [ "$skip" = true ]; then
                git checkout "$PRE_MERGE" -- "$f" 2>/dev/null || true
                continue
              fi
              BASE_EXISTS=$(git cat-file -e "$MERGE_BASE:$f" 2>/dev/null && echo 1 || echo 0)
              OURS_EXISTS=$(git cat-file -e "$PRE_MERGE:$f" 2>/dev/null && echo 1 || echo 0)
              THEIRS_EXISTS=$(git cat-file -e "upstream/main:$f" 2>/dev/null && echo 1 || echo 0)
              if [ "$BASE_EXISTS" = 1 ] && [ "$OURS_EXISTS" = 1 ] && [ "$THEIRS_EXISTS" = 1 ]; then
                git show "$MERGE_BASE:$f" > /tmp/merge-base.tmp 2>/dev/null
                git show "$PRE_MERGE:$f" > /tmp/merge-ours.tmp 2>/dev/null
                git show "upstream/main:$f" > /tmp/merge-theirs.tmp 2>/dev/null
                if git merge-file --ours /tmp/merge-ours.tmp /tmp/merge-base.tmp /tmp/merge-theirs.tmp 2>/dev/null; then
                  cp /tmp/merge-ours.tmp "$f"
                else
                  git checkout "$PRE_MERGE" -- "$f" 2>/dev/null || true
                fi
              elif [ "$OURS_EXISTS" = 1 ]; then
                git checkout "$PRE_MERGE" -- "$f" 2>/dev/null || true
              fi
            done
          fi
          find . -name '*.rej' -delete 2>/dev/null || true

          git add -A
          git commit --no-edit 2>/dev/null || true

          if git diff --quiet HEAD origin/main 2>/dev/null; then
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
            echo "No file changes — upstream already synced."
          else
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          fi

      - name: Push to branch and create PR
        if: steps.merge.outputs.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          BRANCH="sync/upstream-$(date +%s)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          for PR in $(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number'); do
            gh pr close "$PR" --repo "${{ github.repository }}" --comment "Superseded by new sync"
          done

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync upstream commits (${{ steps.check.outputs.commits_behind }} behind)" \
            --body "Automated sync from PortSwigger/mcp-server (${{ steps.check.outputs.commits_behind }} commits behind). Upstream conflicts resolved with -X theirs; our changes replayed on top.")
          gh pr merge --auto --squash "$PR_URL" --repo "${{ github.repository }}"
          echo "PR created: $BRANCH → main (auto-merge enabled)"
