name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PortSwigger/mcp-server.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Nothing to sync
        if: steps.check.outputs.commits_behind == '0'
        run: echo "Upstream is up-to-date"

      - name: Merge upstream into main
        if: steps.check.outputs.commits_behind != '0'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PRE_MERGE=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base upstream/main "$PRE_MERGE" || true)

          # Save our changes for replay on top of upstream
          if [ -n "$MERGE_BASE" ]; then
            git diff --full-index "$MERGE_BASE" HEAD > /tmp/our-patch.patch
          fi

          # Merge accepting upstream for all conflicts
          git merge -X theirs upstream/main --no-edit --allow-unrelated-histories 2>&1 || true

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "CONFLICTS=true" >> $GITHUB_OUTPUT
            echo "Tree-level merge conflicts in:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # Replay our changes on top using 3-way fallback for context mismatches
          if [ -s /tmp/our-patch.patch ] && git apply --3way /tmp/our-patch.patch 2>&1; then
            git add -A
            git commit --amend --no-edit
          fi
          find . -name '*.rej' -delete 2>/dev/null || true

          echo "CONFLICTS=false" >> $GITHUB_OUTPUT

          if git diff --quiet HEAD origin/main 2>/dev/null; then
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
            echo "No file changes — upstream already synced."
          else
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v5
        if: steps.merge.outputs.HAS_CHANGES == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.merge.outputs.HAS_CHANGES == 'true'
        with:
          validate-wrappers: false

      - name: Run tests
        if: steps.merge.outputs.HAS_CHANGES == 'true'
        run: ./gradlew test

      - name: Push to branch and create PR
        if: steps.merge.outputs.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          BRANCH="sync/upstream-$(date +%s)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          # Close any existing sync PRs to keep it clean
          for PR in $(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number'); do
            gh pr close "$PR" --repo "${{ github.repository }}" --comment "Superseded by new sync"
          done

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync upstream commits (${{ steps.check.outputs.commits_behind }} behind)" \
            --body "Automated sync from PortSwigger/mcp-server (${{ steps.check.outputs.commits_behind }} commits behind). Merges with \`-Xours\` — upstream non-conflicting changes accepted, our divergent lines preserved.")
          gh pr merge --auto --squash "$PR_URL" --repo "${{ github.repository }}"
          echo "PR created: $BRANCH → main (auto-merge enabled)"
