name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PortSwigger/mcp-server.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Nothing to sync
        if: steps.check.outputs.commits_behind == '0'
        run: echo "Upstream is up-to-date"

      - name: Merge upstream into main
        if: steps.check.outputs.commits_behind != '0'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge -Xours upstream/main --no-edit --allow-unrelated-histories 2>&1 || true

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "CONFLICTS=true" >> $GITHUB_OUTPUT
            echo "Merge conflicts in:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "CONFLICTS=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        if: steps.check.outputs.commits_behind != '0'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.commits_behind != '0'
        with:
          validate-wrappers: false

      - name: Run tests
        if: steps.check.outputs.commits_behind != '0'
        run: ./gradlew test

      - name: Push to main
        if: steps.check.outputs.commits_behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin main
          echo "Merged ${{ steps.check.outputs.commits_behind }} upstream commit(s) into main"
