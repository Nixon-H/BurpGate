name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PortSwigger/mcp-server.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: No changes
        if: steps.check.outputs.commits_behind == '0'
        run: echo "Upstream is up-to-date"

      - name: Safe-sync unmodified files
        if: steps.check.outputs.commits_behind != '0'
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIFF=$(git diff --name-only HEAD upstream/main || true)

          if [ -z "$UPSTREAM_DIFF" ]; then
            echo "No file-level diff despite commit count"
            exit 0
          fi

          BASE_SHA=$(git merge-base HEAD upstream/main)
          FILES_TO_SYNC=()

          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "NEW: $file"
              FILES_TO_SYNC+=("$file")
            elif git diff --quiet "$BASE_SHA"..HEAD -- "$file" 2>/dev/null; then
              echo "UNMODIFIED: $file"
              FILES_TO_SYNC+=("$file")
            else
              echo "SKIPPED (modified): $file"
            fi
          done <<< "$UPSTREAM_DIFF"

          if [ ${#FILES_TO_SYNC[@]} -eq 0 ]; then
            echo "No files to sync"
          else
            git checkout upstream/main -- "${FILES_TO_SYNC[@]}"
            echo "Synced ${#FILES_TO_SYNC[@]} file(s)"
          fi

      - name: Commit sync
        if: steps.check.outputs.commits_behind != '0'
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: sync upstream changes (unmodified files only)"
          else
            echo "No files to sync — all upstream changes touched modified files"
          fi

      - name: Create PR
        if: steps.check.outputs.commits_behind != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream changes"
          branch: sync/upstream
          delete-branch: true
          title: "Sync upstream PortSwigger/mcp-server"
          body: |
            Safe-sync of upstream changes.

            - **Files merged**: ones we haven't touched since upstream base
            - **Files skipped**: ones we've modified (review manually)
            - **Upstream**: PortSwigger/mcp-server@${{ steps.check.outputs.commits_behind }} new commit(s)
          base: main
