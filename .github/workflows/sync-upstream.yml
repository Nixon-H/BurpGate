name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PortSwigger/mcp-server.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Nothing to sync
        if: steps.check.outputs.commits_behind == '0'
        run: echo "Upstream is up-to-date"

      - name: Merge upstream into main
        if: steps.check.outputs.commits_behind != '0'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PRE_MERGE=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base upstream/main "$PRE_MERGE" || true)

          if [ -n "$MERGE_BASE" ]; then
            git diff --full-index "$MERGE_BASE" HEAD > /tmp/our-patch.patch
          fi

          # Merge but don't commit — we need to restore our workflows first
          git merge -X theirs upstream/main --no-commit --allow-unrelated-histories 2>&1 || true

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Tree-level conflicts in:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # Apply our changes per-file, skip files that don't merge cleanly
          if [ -s /tmp/our-patch.patch ]; then
            OUR_MODIFIED=$(git diff --name-only "$MERGE_BASE" HEAD 2>/dev/null || true)
            for f in $OUR_MODIFIED; do
              pf="/tmp/patch-$(echo "$f" | tr '/' '_').patch"
              git diff --full-index "$MERGE_BASE" HEAD -- "$f" > "$pf" 2>/dev/null
              if [ -s "$pf" ] && ! git apply --3way "$pf" 2>/dev/null; then
                echo "Skipping $f (conflicts, keeping merge result)"
              fi
            done
          fi

          # Always keep our workflow/config files and Tools.kt
          for f in .github/workflows/ .github/dependabot.yml .github/release.yml README.md gradle.properties src/main/kotlin/net/portswigger/mcp/tools/Tools.kt; do
            git checkout "$PRE_MERGE" -- "$f" 2>/dev/null || true
          done
          find . -name '*.rej' -delete 2>/dev/null || true

          git add -A
          git commit --no-edit

          if git diff --quiet HEAD origin/main 2>/dev/null; then
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
            echo "No file changes — upstream already synced."
          else
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          fi

      - name: Push to branch and create PR
        if: steps.merge.outputs.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          BRANCH="sync/upstream-$(date +%s)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          for PR in $(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number'); do
            gh pr close "$PR" --repo "${{ github.repository }}" --comment "Superseded by new sync"
          done

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync upstream commits (${{ steps.check.outputs.commits_behind }} behind)" \
            --body "Automated sync from PortSwigger/mcp-server (${{ steps.check.outputs.commits_behind }} commits behind). Upstream conflicts resolved with -X theirs; our changes replayed on top.")
          gh pr merge --auto --squash "$PR_URL" --repo "${{ github.repository }}"
          echo "PR created: $BRANCH → main (auto-merge enabled)"
