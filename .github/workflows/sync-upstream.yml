name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PortSwigger/mcp-server.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

      - name: Nothing to sync
        if: steps.check.outputs.commits_behind == '0'
        run: echo "Upstream is up-to-date"

      - name: Merge, push, PR, auto-merge
        if: steps.check.outputs.commits_behind != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Setup
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create sync branch off main and merge upstream
          git checkout -b sync/upstream
          git merge upstream/main --no-edit --allow-unrelated-histories 2>&1 || true

          # Detect conflicts
          CONFLICTS=false
          if git diff --name-only --diff-filter=U | grep -q .; then
            CONFLICTS=true
            echo "⚠ Merge conflicts in:"
            git diff --name-only --diff-filter=U
          fi

          # Push branch (will trigger CI)
          git push origin sync/upstream --force

          # Close previous PR if hanging
          OLD_PR=$(gh pr list --head sync/upstream --json number --jq '.[0].number' 2>/dev/null || echo "")
          [ -n "$OLD_PR" ] && gh pr close "$OLD_PR" --delete-branch 2>/dev/null || true

          # Create PR
          BODY="Upstream sync via \`git merge upstream/main\` — **${{ steps.check.outputs.commits_behind }}** new commit(s)."
          if [ "$CONFLICTS" == "true" ]; then
            BODY+="\n\n⚠ **Conflicts detected** — resolve locally, then push to \`sync/upstream\`."
            BODY+="\n\`\`\`\n$(git diff --name-only --diff-filter=U | sed 's/^/  /')\n\`\`\`"
          fi
          BODY+="\n\nAuto-merge enabled — merges once CI passes (no conflicts required)."

          gh pr create \
            --base main \
            --head sync/upstream \
            --title "Sync upstream PortSwigger/mcp-server" \
            --body "$BODY" \
            --label "dependencies"

          # Enable auto-merge
          PR_NUM=$(gh pr list --head sync/upstream --json number --jq '.[0].number')
          gh pr merge "$PR_NUM" --auto --squash \
            --subject "chore: sync upstream PortSwigger/mcp-server (${{ steps.check.outputs.commits_behind }} commits)"
